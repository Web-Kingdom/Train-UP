<!DOCTYPE html>
<html>
<head>
  <title>Brain Hub</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:black;
      color:white;
      min-height:100vh;
      font-family:Arial, sans-serif;
    }

    /* HEADER */

    header{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:15px;
      padding:30px;
      border-bottom:2px solid #aa2222;
      box-shadow:0 0 15px #660000;
    }

    .logo{
      width:160px;
      height:auto;
      position:relative;
      left:-100px;
    }

    header h1{
      font-size:80px;
      font-family:'Orbitron', sans-serif;
      color:#4d0000;

      text-shadow:
        0 0 5px #ff0000,
        0 0 8px #ff0000,
        0 0 20px #ff0000;

      letter-spacing:4px;
    }

    /* RED LINE */

    .line{
      width:80%;
      height:3px;
      background:#aa2222;
      margin:25px auto;
      box-shadow:0 0 15px #aa2222;
    }

    /* GAMES */

    .games{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:30px;
      padding:40px;
    }

    .game-link{
    display:inline-block;
    text-decoration:none;
    color:inherit;
}

    .game-frame{
      width:300px;
      height:220px;

      border:3px solid #aa2222;
      border-radius:15px;

      cursor:pointer;

      background:rgba(255,255,255,0.03);

      box-shadow:
        0 0 15px #aa2222,
        inset 0 0 15px #aa2222;

      transition:0.3s;

      overflow:hidden;
    }

    .game-frame:hover{
      transform:scale(1.05);

      box-shadow:
        0 0 30px #aa2222,
        inset 0 0 20px #aa2222;
    }

    /* CALCULATION CARD */

    .game-img{
      width:100%;
      height:160px;
      object-fit:contain;
      margin-top:5px;
    }

    .game-title{
      text-align:center;

      font-family:'Orbitron', sans-serif;

      font-size:22px;
      font-weight:700;

      color:white;

      letter-spacing:2px;

      margin-top:-5px;

      text-shadow:
        0 0 5px #aa2222,
        0 0 10px #aa2222;
    }

    /* COMING SOON CARDS */

    .coming-title{
      text-align:center;

      margin-top:75px;

      font-size:26px;

      font-family:'Orbitron', sans-serif;

      color:#aa2222;

      letter-spacing:2px;

      text-shadow:
        0 0 5px #aa2222;
    }

    .coming-soon{
      text-align:center;

      margin-top:15px;

      color:gray;

      font-size:14px;

      font-family:'Orbitron', sans-serif;
    }

    /* FOOTER */

    footer{
      text-align:center;
      padding:20px;
      color:gray;
      font-family:'Orbitron', sans-serif;
    }

    /* MOBILE */

    @media (max-width:768px){

      header{
        flex-direction:column;
        gap:10px;
      }

      .logo{
        width:90px;
        left:0;
      }

      header h1{
        font-size:45px;
        text-align:center;
        letter-spacing:2px;
      }

      .line{
        width:90%;
      }

      .games{
        padding:20px;
        gap:20px;
      }

      .game-frame{
        width:90%;
        max-width:320px;
        height:220px;
      }

      .coming-title{
        margin-top:70px;
        font-size:22px;
      }

      footer{
        font-size:12px;
      }
    }

  </style>
</head>

<body>

  <header>

    <img src="images/brain.png"
         class="logo"
         alt="Brain Hub Logo">

    <h1>Brain Hub</h1>

  </header>

  <div class="line"></div>

    <section class="games">

  <a href="calculation/script.html" class="game-link">
    <div class="game-frame">
      <img src="images/calculation.png" class="game-img" alt="Calculation">
      <div class="game-title">CALCULATION</div>
    </div>
  </a>

  <a href="#" class="game-link">
    <div class="game-frame">
      <div class="coming-title">Coming Soon</div>
      <div class="coming-soon">New Game</div>
    </div>
  </a>

  <a href="#" class="game-link">
    <div class="game-frame">
      <div class="coming-title">Coming Soon</div>
      <div class="coming-soon">New Game</div>
    </div>
  </a>

  <a href="#" class="game-link">
    <div class="game-frame">
      <div class="coming-title">Coming Soon</div>
      <div class="coming-soon">New Game</div>
    </div>
  </a>

  <a href="#" class="game-link">
    <div class="game-frame">
      <div class="coming-title">Coming Soon</div>
      <div class="coming-soon">New Game</div>
    </div>
  </a>

  <a href="#" class="game-link">
    <div class="game-frame">
      <div class="coming-title">Coming Soon</div>
      <div class="coming-soon">New Game</div>
    </div>
  </a>

</section>
  
  <footer>
    More games coming soon...
  </footer>

</body>
</html>
