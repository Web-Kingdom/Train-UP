<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brain Hub - Calculation Challenge</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="script.css">
</head>
    
<body>

<header>

    <div class="logo">
        🧠 Brain Hub
    </div>

    <a href="../home.html" class="back-btn">Back</a>

</header>

<div class="container">

    <div class="top-info">

        <div class="stage">
            Stage:
            <span id="stage">1</span>
        </div>

        <div class="difficulty" id="difficulty">
            Extremely Easy
        </div>

    </div>

    <div class="timer">
        ⏳
        <span id="timer">10</span>
    </div>

    <div class="question" id="question">
        Loading...
    </div>

    <div class="answer-area">

        <input
            type="number"
            id="answer"
            autofocus
            autocomplete="off">

    </div>

    <div class="info">
        Press ENTER to submit
    </div>

</div>

<div class="status-ball" id="ball"></div>

<footer>
    Brain Hub • Calculation Challenge
</footer>

<script src="script.js"></script>

</body>
</html>
